appId: com.areimel.shadervideoplayer
productName: Shader Video Player
copyright: Copyright © Alec Reimel, Babu Studios
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - dist-renderer/**
  - package.json
extraResources:
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
linux:
  target:
    - target: deb
      arch: x64
  category: AudioVideo;Video;Player
  icon: build/icons
  maintainer: Alec Reimel <areimel@users.noreply.github.com>
  mimeTypes:
    - video/mp4
    - video/x-m4v
    - video/quicktime
    - video/x-matroska
    - video/webm
    - video/x-msvideo
    - video/x-ms-wmv
    - video/x-flv
    - video/mp2t
    - video/mpeg
    - video/3gpp
    - video/hevc
    - video/av1
    - video/ogg
  fileAssociations:
    - { ext: mp4, name: MPEG-4 Video, mimeType: video/mp4 }
    - { ext: m4v, name: M4V Video, mimeType: video/x-m4v }
    - { ext: mov, name: QuickTime Movie, mimeType: video/quicktime }
    - { ext: mkv, name: Matroska Video, mimeType: video/x-matroska }
    - { ext: webm, name: WebM Video, mimeType: video/webm }
    - { ext: avi, name: AVI Video, mimeType: video/x-msvideo }
    - { ext: wmv, name: Windows Media Video, mimeType: video/x-ms-wmv }
    - { ext: flv, name: Flash Video, mimeType: video/x-flv }
    - { ext: ts, name: MPEG Transport Stream, mimeType: video/mp2t }
    - { ext: mts, name: AVCHD Video, mimeType: video/mp2t }
    - { ext: m2ts, name: Blu-ray MPEG-2 Transport Stream, mimeType: video/mp2t }
    - { ext: mpeg, name: MPEG Video, mimeType: video/mpeg }
    - { ext: mpg, name: MPEG Video, mimeType: video/mpeg }
    - { ext: 3gp, name: 3GPP Video, mimeType: video/3gpp }
    - { ext: hevc, name: HEVC Video, mimeType: video/hevc }
    - { ext: h265, name: HEVC Video, mimeType: video/hevc }
    - { ext: av1, name: AV1 Video, mimeType: video/av1 }
    - { ext: ogv, name: Ogg Video, mimeType: video/ogg }
deb:
  depends:
    - ffmpeg
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
artifactName: shader-video-player_${version}_${arch}.${ext}
